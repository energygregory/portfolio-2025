<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GREG'S TRAFFIC TOWER</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', monospace; overflow: hidden; }
        #hud { position: absolute; top: 20px; left: 20px; z-index: 100; pointer-events: none; }
        h1 { font-size: 24px; text-transform: uppercase; border-bottom: 2px solid #0f0; display: inline-block; }
        #stats { font-size: 14px; margin-top: 10px; }
        .log-entry { opacity: 0.8; margin-bottom: 4px; font-size: 12px; }
        .new-flash { color: #fff; text-shadow: 0 0 10px #fff; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    </style>
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

<div id="hud">
    <h1>TRAFFIC TOWER // ONLINE</h1>
    <div id="stats">
        <div>HITS TODAY: <span id="count">0</span></div>
        <div id="last-loc">WAITING FOR SIGNAL...</div>
    </div>
    <div id="log" style="margin-top:20px; max-height: 300px; overflow:hidden;"></div>
</div>

<div id="canvas-container"></div>

<script>
    // --- 1. VISUALS (The Globe) ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.002);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 15;
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Wireframe Sphere
    const geometry = new THREE.IcosahedronGeometry(5, 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true, transparent: true, opacity: 0.3 });
    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    // Particle Stars
    const starGeom = new THREE.BufferGeometry();
    const starCount = 1000;
    const starPos = new Float32Array(starCount * 3);
    for(let i=0; i<starCount*3; i++) {
        starPos[i] = (Math.random() - 0.5) * 100;
    }
    starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMat = new THREE.PointsMaterial({ color: 0x444444, size: 0.1 });
    const stars = new THREE.Points(starGeom, starMat);
    scene.add(stars);

    function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002;
        globe.rotation.x += 0.001;
        stars.rotation.y -= 0.0005;
        renderer.render(scene, camera);
    }
    animate();

    // --- 2. COMMS (The Socket) ---
    // CHANGE THIS URL to your Production Backend URL
    const socket = io('http://localhost:3000'); 

    const countEl = document.getElementById('count');
    const logEl = document.getElementById('log');

    function logHit(hit) {
        const div = document.createElement('div');
        div.className = 'log-entry new-flash';
        div.innerText = `> DETECTED: ${hit.city}, ${hit.country} [${hit.time}]`;
        logEl.insertBefore(div, logEl.firstChild);
        
        // Remove flash effect
        setTimeout(() => div.classList.remove('new-flash'), 500);
        
        // Cleanup old logs
        if (logEl.children.length > 15) logEl.lastChild.remove();
    }

    socket.on('connect', () => {
        console.log('HUD Connected');
        socket.emit('admin_join');
    });

    socket.on('init_data', (data) => {
        countEl.innerText = data.total;
        if (data.history.length > 0) {
            data.history.slice(0, 10).forEach(h => logHit(h));
        }
    });

    socket.on('admin_update', (data) => {
        countEl.innerText = data.total;
        logHit(data.new_hit);
        
        // Visual Pulse on Globe
        globe.scale.set(1.2, 1.2, 1.2);
        setTimeout(() => globe.scale.set(1,1,1), 200);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
