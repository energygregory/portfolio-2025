<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Import PT Mono for monospace headings/navigation -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=PT+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="preload" href="/LOGOS/newlogo.png" as="image" />
    <link rel="preload" href="/1221.webm" as="video" type="video/webm" />
    <link rel="preload" href="/animation.webm" as="video" type="video/webm" />
    <!-- Preload first 6 portfolio images for instant display -->
    <link rel="preload" href="/Images/2025/black1.png" as="image" />
    <link rel="preload" href="/Images/2025/black2.png" as="image" />
    <link rel="preload" href="/Images/2025/white1.png" as="image" />
    <link rel="preload" href="/Images/2025/white2.png" as="image" />
    <link rel="preload" href="/Images/2025/black.png" as="image" />
    <link rel="preload" href="/Images/2025/white.png" as="image" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <title>portfolio</title>
  </head>
  <body>
    <!-- Initial loading screen - shows immediately before React loads -->
    <div id="initial-loader" style="position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;">
      <img src="/LOGOS/newlogo.svg" alt="" style="width:80px;height:80px;animation:pulse 1.5s ease-in-out infinite;" />
      <style>
        @keyframes pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.5; transform: scale(0.95); }
        }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
